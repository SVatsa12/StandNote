<!DOCTYPE html>
<html>
<head>
  <title>Microphone Access</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 1.2rem; color: #1a73e8; }
    p { color: #5f6368; }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #188038;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>StandNote — Microphone Access</h1>
    <p>Please click <strong>Allow</strong> on the Chrome permission prompt at the top of the browser to enable recording.</p>
    <p class="status" id="status">Waiting for permission...</p>
  </div>
  <script>
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        document.getElementById('status').textContent = 'Permission granted! You can close this tab.';
        stream.getTracks().forEach(t => t.stop());
      })
      .catch(err => {
        document.getElementById('status').textContent = 'Permission denied. Please allow microphone access and reload.';
        document.getElementById('status').style.color = '#c5221f';
      });
  </script>
</body>
</html>
