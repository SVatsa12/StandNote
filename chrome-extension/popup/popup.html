<!DOCTYPE html>
<html>
<head>
  <title>StandNote Transcriber</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>StandNote</h1>
      <p>Live Meeting Transcriber</p>
    </header>

    <div id="error-message-area" class="error-container" style="display: none;">
      <p id="error-text"></p>
      <div id="error-actions" style="display: none;">
        <button id="retryBtn" class="btn btn-secondary">Try Again</button>
        <button id="openSettingsBtn" class="btn btn-secondary" style="display: none;">Mic Settings</button>
      </div>
    </div>

    <div id="recording-view" style="display: none;">
      <div id="status-display" class="status-recording">
        <div class="recording-dot"></div>
        <span id="recording-status-text">Recording in progress...</span>
      </div>
      <button id="stopBtn" class="btn btn-danger">Stop Recording</button>
    </div>

    <div id="idle-view">
      <form id="startForm">
        <div class="form-group">
          <label for="meetingTitle">Meeting Title</label>
          <input type="text" id="meetingTitle" placeholder="e.g., Q3 Project Sync" required>
        </div>
        <div class="form-group">
          <label>Audio Source</label>
          <div class="radio-group">
            <input type="radio" id="mic" name="audioType" value="mic" checked>
            <label for="mic">Microphone</label>
            <input type="radio" id="tab" name="audioType" value="tab">
            <label for="tab">Tab Audio</label>
          </div>
        </div>
        <button id="startBtn" type="submit" class="btn btn-primary">Start Recording</button>
      </form>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
